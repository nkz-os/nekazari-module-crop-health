# =============================================================================
# Crop Health — "toca hacer" work alerts CronJob
# =============================================================================
# Drives POST /internal/work-alerts/run in-cluster (NOT via the public gateway),
# once per installed tenant (entity-manager installation list). Set
# SCHEDULED_TENANTS (comma-separated) only to override that list.
# =============================================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: crop-health-work-alerts
  namespace: nekazari
  labels:
    app: crop-health-backend
    component: cronjob
    module: crop-health
spec:
  schedule: "30 4 * * *"        # daily 04:30 UTC, after the assessments
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: crop-health-backend
            component: cronjob
            module: crop-health
        spec:
          restartPolicy: Never
          containers:
            - name: work-alerts
              # SHA-pin at deploy time — never :latest (see CLAUDE.md K8s rules).
              image: ghcr.io/nkz-os/nekazari-module-crop-health:latest  # main 1b9ac8b
              command: ["python", "-m", "scripts.cron_work_alerts"]
              # NOTE: the backend Dockerfile sets WORKDIR /app and copies
              # app/ -> /app/app/ and scripts/ -> /app/scripts/ (no nested
              # /app/backend in the image), so workingDir is /app.
              workingDir: /app
              env:
                - name: SELF_URL
                  value: "http://crop-health-api-service:8000"
                - name: INTERNAL_SERVICE_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: internal-service-secret
                      key: INTERNAL_SERVICE_SECRET
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
